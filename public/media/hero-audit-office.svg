<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 720" role="img" aria-label="">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f8fbff"/>
    <stop offset=".46" stop-color="#eaf3fb"/>
    <stop offset="1" stop-color="#dce9f5"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".82"/>
    <stop offset="1" stop-color="#bdd6ea" stop-opacity=".52"/>
  </linearGradient>
  <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#d8e1e9"/>
  </linearGradient>
  <filter id="blur18"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#001950" flood-opacity=".16"/>
  </filter>
</defs>

<rect width="1800" height="720" fill="url(#bg)"/>

<!-- office depth -->
<g opacity=".68" filter="url(#blur8)">
  <rect x="750" y="40" width="280" height="390" rx="10" fill="url(#glass)"/>
  <rect x="1050" y="25" width="250" height="405" rx="10" fill="url(#glass)"/>
  <rect x="1320" y="55" width="300" height="375" rx="10" fill="url(#glass)"/>
  <rect x="775" y="65" width="9" height="330" fill="#8bb8d5" opacity=".45"/>
  <rect x="1082" y="45" width="9" height="355" fill="#8bb8d5" opacity=".42"/>
  <rect x="1360" y="75" width="9" height="330" fill="#8bb8d5" opacity=".38"/>
  <ellipse cx="1170" cy="188" rx="160" ry="62" fill="#ffffff" opacity=".32"/>
</g>

<!-- soft ceiling lights -->
<g opacity=".58" filter="url(#blur18)">
  <rect x="860" y="64" width="220" height="26" rx="13" fill="#ffffff"/>
  <rect x="1180" y="72" width="190" height="24" rx="12" fill="#ffffff"/>
  <rect x="1450" y="86" width="160" height="22" rx="11" fill="#ffffff"/>
</g>

<!-- distant furniture -->
<g opacity=".34" filter="url(#blur8)" fill="#496b8d">
  <rect x="920" y="300" width="180" height="26" rx="8"/>
  <rect x="950" y="326" width="22" height="128" rx="8"/>
  <rect x="1048" y="326" width="22" height="128" rx="8"/>
  <rect x="1250" y="286" width="205" height="28" rx="8"/>
  <rect x="1280" y="314" width="22" height="132" rx="8"/>
  <rect x="1400" y="314" width="22" height="132" rx="8"/>
</g>

<!-- foreground desk -->
<path d="M510 480 C760 430 1120 430 1680 492 L1800 720 H420 Z" fill="url(#desk)" opacity=".96"/>
<path d="M600 505 C880 466 1200 472 1665 522" fill="none" stroke="#b9c9d8" stroke-width="3" opacity=".65"/>

<!-- report sheet -->
<g transform="translate(1030 480) rotate(3)" filter="url(#shadow)">
  <rect width="420" height="178" rx="15" fill="#ffffff"/>
  <rect x="28" y="24" width="122" height="10" rx="5" fill="#d9e4ee"/>
  <rect x="28" y="46" width="196" height="8" rx="4" fill="#edf2f6"/>
  <rect x="30" y="80" width="24" height="55" rx="5" fill="#198ef2"/>
  <rect x="66" y="98" width="24" height="37" rx="5" fill="#5ab4ff"/>
  <rect x="102" y="67" width="24" height="68" rx="5" fill="#0875d1"/>
  <rect x="138" y="88" width="24" height="47" rx="5" fill="#31a3ff"/>
  <circle cx="286" cy="105" r="44" fill="#f1f5f8"/>
  <path d="M286 105 L286 61 A44 44 0 0 1 326 124 Z" fill="#ff8b1f"/>
  <path d="M286 105 L326 124 A44 44 0 0 1 257 139 Z" fill="#12a975"/>
  <path d="M286 105 L257 139 A44 44 0 0 1 286 61 Z" fill="#198ef2"/>
  <rect x="348" y="78" width="42" height="7" rx="3.5" fill="#dbe5ee"/>
  <rect x="348" y="94" width="31" height="7" rx="3.5" fill="#e7edf3"/>
  <rect x="348" y="110" width="37" height="7" rx="3.5" fill="#e7edf3"/>
</g>

<!-- tablet -->
<g transform="translate(1460 285) rotate(7)" filter="url(#shadow)">
  <rect width="255" height="188" rx="18" fill="#10233e"/>
  <rect x="10" y="10" width="235" height="168" rx="12" fill="#f8fbfd"/>
  <rect x="28" y="29" width="90" height="9" rx="4.5" fill="#dce5ed"/>
  <rect x="28" y="48" width="135" height="7" rx="3.5" fill="#eef2f5"/>
  <rect x="30" y="93" width="18" height="50" rx="4" fill="#198ef2"/>
  <rect x="58" y="75" width="18" height="68" rx="4" fill="#ff8b1f"/>
  <rect x="86" y="105" width="18" height="38" rx="4" fill="#12a975"/>
  <rect x="114" y="65" width="18" height="78" rx="4" fill="#0d6fc3"/>
  <path d="M150 126 C170 90 188 104 207 72 221 49 230 55 235 48" fill="none" stroke="#198ef2" stroke-width="6" stroke-linecap="round"/>
</g>

<!-- clipboard / inspection cue -->
<g transform="translate(720 450) rotate(-6)" opacity=".94" filter="url(#shadow)">
  <rect width="225" height="174" rx="16" fill="#fff"/>
  <rect x="80" y="-12" width="66" height="30" rx="12" fill="#001950"/>
  <rect x="31" y="45" width="18" height="18" rx="4" fill="#eaf3fb" stroke="#198ef2" stroke-width="3"/>
  <path d="M35 53 l5 5 10 -12" fill="none" stroke="#198ef2" stroke-width="3"/>
  <rect x="62" y="49" width="118" height="8" rx="4" fill="#dbe5ee"/>
  <rect x="31" y="83" width="18" height="18" rx="4" fill="#eaf8f2" stroke="#12a975" stroke-width="3"/>
  <path d="M35 91 l5 5 10 -12" fill="none" stroke="#12a975" stroke-width="3"/>
  <rect x="62" y="87" width="104" height="8" rx="4" fill="#dbe5ee"/>
  <rect x="31" y="121" width="18" height="18" rx="4" fill="#fff3e8" stroke="#ff8b1f" stroke-width="3"/>
  <rect x="62" y="125" width="126" height="8" rx="4" fill="#dbe5ee"/>
</g>

<!-- left white readability wash -->
<rect width="900" height="720" fill="url(#glass)" opacity=".72"/>
<rect width="700" height="720" fill="#ffffff" opacity=".56"/>
</svg>